<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    <h1>MULTIMEDIA</h1>
    <h2> Imágen</h2>
    <img 8px="" alt="Moth" border-radius:="8px" height="50%" loading="lazy" src="https://images.pexels.com/photos/4105620/pexels-photo-4105620.jpeg" width="50%" />
 <br />
 <style>
    img { max-width: 70%; height: 70%; border-radius: 100px; }
  </style>
<br />
<h2>Video de youtube</h2>
<iframe allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="" frameborder="0" height="315" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube.com/embed/JQL25_hoQ1k?si=RcucipYOnXFubejn" title="YouTube video player" width="560"></iframe>

<br /> <br /> <br /> <br />
<h2>Video descargado</h2><div><br /></div>
<video controls="" height="315" poster="https://images.pexels.com/photos/17010233/pexels-photo-17010233.jpeg" width="640">
<source src="https://www.pexels.com/download/video/28157911/" type="video/mp4"></source> </video>
<audio id="musicaFondo" src="spellbound-official-music-video.mp3" loop></audio>
<button id="botonMusica">▶ Reproducir música</button>
<Script>
const audio = document.getElementById('musicaFondo');
const boton = document.getElementById('botonMusica');
boton.addEventListener('click', () => {
if (audio.paused) { audio.play(); boton.textContent = '⏸ Pausar música'; }
else { audio.pause(); boton.textContent = '▶ Reproducir música'; }
});
</Script>, 
    
</body>
</html>
